<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#07090d" />
<title>FRONTLINES — Spectator</title>
<meta name="description" content="Frontlines broadcast client. Approved accounts only." />
<style>
  :root {
    --bg:#07090d; --panel:#0d1017; --panel-2:#131722; --line:#1e2532; --line-2:#2a3342;
    --text:#e6ebf2; --text-dim:#8b97a8; --text-mute:#5b6675;
    --accent:#e8873a; --accent-2:#ffb457; --atk:#e2603c; --def:#3f8fd0;
    --good:#4fbf7b; --bad:#e0453c; --rec:#e0453c;
    --font:'Rajdhani','Barlow Condensed','Oswald','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none}
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui>*{pointer-events:auto}
  #fatal{position:fixed;inset:0;z-index:999;display:none;background:#0a0c11;padding:48px;
    font-family:var(--mono);font-size:13px;line-height:1.7;overflow:auto}
  #fatal h1{font-family:var(--font);font-size:28px;letter-spacing:.2em;color:var(--bad);margin-bottom:18px}
  #fatal pre{white-space:pre-wrap;color:#9aa6b6}
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="fatal"><h1>SYSTEM FAULT</h1><pre id="fatalmsg"></pre></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
